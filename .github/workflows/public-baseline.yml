name: Public baseline

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: public-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-diff:
    name: Repository diff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA" --
          echo 'Public minimal baseline passed; private reusable policy and secret-history scanning were not run.'
