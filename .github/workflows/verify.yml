name: Verify

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Java 21 full verification
    runs-on: [self-hosted, linux, x64, proart]
    timeout-minutes: 90
    container:
      image: ghcr.io/experto-hub/ci-java21@sha256:2e92bf86bbb59cf1ae1447bdeca327909ac160885da4600ff051ef1bfbf6d56d
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
        TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
        TESTCONTAINERS_RYUK_DISABLED: "false"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      options: --add-host host.docker.internal:host-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify ProArt environment
        shell: bash
        run: |
          set -euo pipefail

          expected_image='ghcr.io/experto-hub/ci-java21@sha256:2e92bf86bbb59cf1ae1447bdeca327909ac160885da4600ff051ef1bfbf6d56d'
          java_feature="$(
            java -XshowSettings:properties -version 2>&1 |
              awk -F' = ' '/^[[:space:]]*java.specification.version = / { print $2; exit }'
          )"
          javac_version="$(javac -version 2>&1 | awk '{ print $2 }')"
          test "$java_feature" = "21"
          test "${javac_version%%.*}" = "21"

          test -d "$GITHUB_WORKSPACE"
          test -w "$GITHUB_WORKSPACE"
          workspace_probe="${GITHUB_WORKSPACE}/.system-proof-write-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f -- "$workspace_probe"' EXIT
          : > "$workspace_probe"
          test -s /etc/ssl/certs/ca-certificates.crt

          test "$DOCKER_HOST" = "unix:///var/run/docker.sock"
          test "$TESTCONTAINERS_HOST_OVERRIDE" = "host.docker.internal"
          test -S /var/run/docker.sock
          test -r /var/run/docker.sock
          test -w /var/run/docker.sock
          test "$(curl --fail --silent --show-error --unix-socket /var/run/docker.sock http://localhost/_ping)" = "OK"
          test "$(curl --fail --silent --show-error --unix-socket /var/run/docker.sock http://localhost/v1.40/_ping)" = "OK"

          container_json="$(
            curl --fail --silent --show-error \
              --unix-socket /var/run/docker.sock \
              "http://localhost/containers/${HOSTNAME}/json"
          )"
          if [[ "$container_json" != *"\"Image\":\"${expected_image}\""* ]]; then
            echo "The running job container does not use ${expected_image}." >&2
            exit 1
          fi
          test -n "$(getent ahostsv4 host.docker.internal | awk 'NR == 1 { print $1 }')"

          echo "Java feature version: ${java_feature}"
          echo "javac version: ${javac_version}"
          echo "CI image: ${expected_image}"
          echo "Docker daemon: reachable through ${DOCKER_HOST}"
          echo "Docker API version: 1.40"
          echo "Testcontainers host override: ${TESTCONTAINERS_HOST_OVERRIDE}"

      - name: Acquire shared Docker verification lock
        id: docker_lock
        shell: bash
        run: |
          set -euo pipefail

          expected_image='ghcr.io/experto-hub/ci-java21@sha256:2e92bf86bbb59cf1ae1447bdeca327909ac160885da4600ff051ef1bfbf6d56d'
          lock_name='system-proof-docker-verification-lock'
          lock_response="${RUNNER_TEMP}/system-proof-docker-lock-response.json"
          owner_response="${RUNNER_TEMP}/system-proof-docker-lock-owner.json"
          lock_id_file="${RUNNER_TEMP}/system-proof-docker-lock-id.txt"
          lock_startup_grace_seconds=60
          lock_lease_seconds=1500
          payload="$(cat <<JSON
          {
            "Image": "${expected_image}",
            "Cmd": [
              "curl",
              "--fail",
              "--silent",
              "--show-error",
              "--unix-socket",
              "/var/run/docker.sock",
              "--request",
              "POST",
              "http://localhost/v1.40/containers/${HOSTNAME}/wait?condition=not-running"
            ],
            "Labels": {
              "io.github.experto-hub.system-proof.docker-verification-lock": "true",
              "io.github.experto-hub.system-proof.run-id": "${GITHUB_RUN_ID}",
              "io.github.experto-hub.system-proof.run-attempt": "${GITHUB_RUN_ATTEMPT}",
              "io.github.experto-hub.system-proof.owner-container-id": "${HOSTNAME}",
              "io.github.experto-hub.system-proof.lock-created-epoch": "__CREATED_EPOCH__",
              "io.github.experto-hub.system-proof.lock-lease-seconds": "${lock_lease_seconds}"
            },
            "HostConfig": {
              "AutoRemove": true,
              "Binds": ["/var/run/docker.sock:/var/run/docker.sock"]
            }
          }
          JSON
          )"

          while true; do
            create_payload="${payload/__CREATED_EPOCH__/$(date +%s)}"
            create_status="$(
              curl --silent --show-error \
                --unix-socket /var/run/docker.sock \
                --output "$lock_response" \
                --write-out '%{http_code}' \
                --header 'Content-Type: application/json' \
                --request POST \
                --data-binary "$create_payload" \
                "http://localhost/v1.40/containers/create?name=${lock_name}"
            )"

            if [[ "$create_status" = "409" ]]; then
              inspect_status="$(
                curl --silent --show-error \
                  --unix-socket /var/run/docker.sock \
                  --output "$lock_response" \
                  --write-out '%{http_code}' \
                  "http://localhost/v1.40/containers/${lock_name}/json"
              )"
              if [[ "$inspect_status" = "404" ]]; then
                continue
              fi
              if [[ "$inspect_status" != "200" ]]; then
                cat "$lock_response" >&2
                echo "Cannot inspect the shared Docker verification lock (HTTP ${inspect_status})." >&2
                exit 1
              fi

              lock_json="$(< "$lock_response")"
              if [[ "$lock_json" != *'"io.github.experto-hub.system-proof.docker-verification-lock":"true"'* ]]; then
                echo "The shared Docker lock name is owned by an unexpected container." >&2
                exit 1
              fi

              stale_lock_id="$(sed -nE 's/^.*"Id":"([0-9a-f]{12,64})".*$/\1/p' "$lock_response")"
              owner_id="$(
                sed -nE \
                  's/^.*"io.github.experto-hub.system-proof.owner-container-id":"([0-9a-f]{12,64})".*$/\1/p' \
                  "$lock_response"
              )"
              lock_created_epoch="$(
                sed -nE \
                  's/^.*"io.github.experto-hub.system-proof.lock-created-epoch":"([0-9]+)".*$/\1/p' \
                  "$lock_response"
              )"
              if [[ -z "$stale_lock_id" || -z "$owner_id" || ! "$lock_created_epoch" =~ ^[0-9]+$ ]]; then
                echo "The shared Docker lock is missing valid ownership metadata." >&2
                exit 1
              fi

              lock_age_seconds=$(( $(date +%s) - lock_created_epoch ))
              if (( lock_age_seconds < 0 )); then
                echo "The shared Docker lock creation time is in the future." >&2
                exit 1
              fi

              owner_running='false'
              owner_json=''
              owner_status="$(
                curl --silent --show-error \
                  --unix-socket /var/run/docker.sock \
                  --output "$owner_response" \
                  --write-out '%{http_code}' \
                  "http://localhost/v1.40/containers/${owner_id}/json"
              )"
              if [[ "$owner_status" = "200" ]]; then
                owner_json="$(< "$owner_response")"
                if [[ "$owner_json" = *'"Running":true'* ]]; then
                  owner_running='true'
                fi
              elif [[ "$owner_status" != "404" ]]; then
                cat "$owner_response" >&2
                echo "Cannot inspect the Docker lock owner (HTTP ${owner_status})." >&2
                exit 1
              fi

              reclaim_reason=''
              if (( lock_age_seconds >= lock_lease_seconds )); then
                if [[ "$owner_running" = "true" ]]; then
                  if [[ "$owner_id" = "$HOSTNAME" || "$owner_json" != *"${expected_image}"* ]]; then
                    echo "Refusing to stop an unexpected expired Docker lock owner." >&2
                    exit 1
                  fi
                  owner_delete_status="$(
                    curl --silent --show-error \
                      --unix-socket /var/run/docker.sock \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      --request DELETE \
                      "http://localhost/v1.40/containers/${owner_id}?force=true"
                  )"
                  if [[ "$owner_delete_status" != "204" && "$owner_delete_status" != "404" ]]; then
                    echo "Cannot stop the expired Docker lock owner (HTTP ${owner_delete_status})." >&2
                    exit 1
                  fi
                  echo "Stopped expired Docker lock owner ${owner_id}."
                  sleep 5
                fi
                reclaim_reason='the 25-minute lock lease expired'
              elif [[ "$lock_json" = *'"Running":false'* ]]; then
                if [[ "$owner_running" = "false" ]]; then
                  reclaim_reason='the recorded owner is not running'
                elif (( lock_age_seconds >= lock_startup_grace_seconds )); then
                  reclaim_reason='the helper did not start within 60 seconds'
                fi
              fi

              if [[ -n "$reclaim_reason" ]]; then
                delete_status="$(
                  curl --silent --show-error \
                    --unix-socket /var/run/docker.sock \
                    --output /dev/null \
                    --write-out '%{http_code}' \
                    --request DELETE \
                    "http://localhost/v1.40/containers/${stale_lock_id}?force=true"
                )"
                if [[ "$delete_status" != "204" && "$delete_status" != "404" ]]; then
                  echo "Cannot reclaim the stale Docker verification lock (HTTP ${delete_status})." >&2
                  exit 1
                fi
                echo "Reclaimed stale Docker verification lock ${stale_lock_id}: ${reclaim_reason}."
                continue
              fi

              echo "Another System Proof verification owns the Docker lock; waiting."
              sleep 5
              continue
            fi
            if [[ "$create_status" != "201" ]]; then
              cat "$lock_response" >&2
              echo "Cannot create the shared Docker verification lock (HTTP ${create_status})." >&2
              exit 1
            fi

            lock_id="$(sed -nE 's/^.*"Id":"([0-9a-f]{12,64})".*$/\1/p' "$lock_response")"
            test -n "$lock_id"
            printf '%s\n' "$lock_id" > "$lock_id_file"
            echo "acquired=true" >> "$GITHUB_OUTPUT"
            start_status="$(
              curl --silent --show-error \
                --unix-socket /var/run/docker.sock \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST \
                "http://localhost/v1.40/containers/${lock_id}/start"
            )"
            if [[ "$start_status" != "204" ]]; then
              curl --silent --show-error \
                --unix-socket /var/run/docker.sock \
                --request DELETE \
                "http://localhost/v1.40/containers/${lock_id}?force=true" >/dev/null || true
              echo "Cannot start the shared Docker verification lock (HTTP ${start_status})." >&2
              exit 1
            fi
            echo "Acquired shared Docker verification lock ${lock_id}."
            break
          done

          testcontainers_resource_ids() {
            local endpoint="$1"
            shift
            curl --fail --silent --show-error \
              --unix-socket /var/run/docker.sock \
              --get \
              "$@" \
              --data-urlencode 'filters={"label":["org.testcontainers=true"]}' \
              "http://localhost/${endpoint}" |
              tr '{},' '\n' |
              sed -nE 's/^[[:space:]]*"Id":"([0-9a-f]{12,64})".*$/\1/p' |
              sort --unique
          }

          {
            echo '[containers]'
            testcontainers_resource_ids containers/json --data-urlencode 'all=1'
            echo '[networks]'
            testcontainers_resource_ids networks
          } > "${RUNNER_TEMP}/system-proof-testcontainers-before.txt"

      - name: Run unit, integration, and full-topology smoke tests
        timeout-minutes: 20
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dapi.version=1.40
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify Testcontainers cleanup
        if: ${{ always() && steps.docker_lock.outputs.acquired == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          testcontainers_resource_ids() {
            local endpoint="$1"
            shift
            curl --fail --silent --show-error \
              --unix-socket /var/run/docker.sock \
              --get \
              "$@" \
              --data-urlencode 'filters={"label":["org.testcontainers=true"]}' \
              "http://localhost/${endpoint}" |
              tr '{},' '\n' |
              sed -nE 's/^[[:space:]]*"Id":"([0-9a-f]{12,64})".*$/\1/p' |
              sort --unique
          }

          snapshot_resources() {
            {
              echo '[containers]'
              testcontainers_resource_ids containers/json --data-urlencode 'all=1'
              echo '[networks]'
              testcontainers_resource_ids networks
            } > "$1"
          }

          baseline="${RUNNER_TEMP}/system-proof-testcontainers-before.txt"
          current="${RUNNER_TEMP}/system-proof-testcontainers-after.txt"
          test -f "$baseline"

          for _ in $(seq 1 30); do
            snapshot_resources "$current"
            if cmp --silent "$baseline" "$current"; then
              echo "Testcontainers containers and networks returned to the pre-build baseline."
              exit 0
            fi
            sleep 1
          done

          echo "Testcontainers resources differ from the pre-build baseline:" >&2
          diff --unified "$baseline" "$current" >&2 || true
          exit 1

      - name: Release shared Docker verification lock
        if: ${{ always() && steps.docker_lock.outputs.acquired == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          lock_id="$(< "${RUNNER_TEMP}/system-proof-docker-lock-id.txt")"
          response="${RUNNER_TEMP}/system-proof-docker-lock-release.json"
          release_status="$(
            curl --silent --show-error \
              --unix-socket /var/run/docker.sock \
              --output "$response" \
              --write-out '%{http_code}' \
              --request DELETE \
              "http://localhost/v1.40/containers/${lock_id}?force=true"
          )"
          if [[ "$release_status" != "204" && "$release_status" != "404" ]]; then
            cat "$response" >&2
            echo "Cannot release the shared Docker verification lock (HTTP ${release_status})." >&2
            exit 1
          fi
          echo "Released shared Docker verification lock ${lock_id}."
