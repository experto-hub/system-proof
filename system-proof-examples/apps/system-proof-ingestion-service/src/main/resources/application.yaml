server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

system-proof:
  ingestion:
    acknowledgement-mode: ${SYSTEM_PROOF_INGESTION_ACKNOWLEDGEMENT_MODE:after-commit}
